<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">iLearnOrb — Turn the page. Change your world.</title>
  <desc id="desc">A designed social-sharing graphic for a curated Nigerian book catalogue.</desc>
  <defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04112B"/><stop offset="1" stop-color="#0A3D91"/></linearGradient><linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E8F0FF"/><stop offset="1" stop-color="#AAC9FF"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <g fill="none" stroke="#75A9FF" opacity=".2"><circle cx="946" cy="304" r="264"/><ellipse cx="946" cy="304" rx="255" ry="137" transform="rotate(-30 946 304)"/><circle cx="946" cy="304" r="190"/></g>
  <g font-family="Arial, sans-serif"><text x="75" y="92" fill="#FFFFFF" font-size="34" font-weight="700" letter-spacing="-1"><tspan fill="#9CC6FF">i</tspan>Learn<tspan fill="#9CC6FF">Orb</tspan></text><text x="77" y="155" fill="#ADC9F0" font-size="14" letter-spacing="4">LEARN. GROW. BECOME.</text><text x="72" y="267" fill="#FFFFFF" font-size="74" font-weight="700" letter-spacing="-4">Turn the page.</text><text x="72" y="353" fill="#9CC6FF" font-size="74" font-weight="700" letter-spacing="-4">Change your world.</text><text x="77" y="432" fill="#C1D2EB" font-size="21">100 books. 10 ways to grow.</text><text x="77" y="537" fill="#B1C9EC" font-size="16">ADO EKITI, NIGERIA</text></g>
  <g transform="translate(900 135) rotate(10)"><rect x="11" y="17" width="215" height="330" rx="7" fill="#02102B" opacity=".35"/><rect width="215" height="330" rx="5" fill="url(#cover)"/><rect width="10" height="330" fill="#0A3D91" opacity=".13"/><g fill="none" stroke="#0A3D91" opacity=".18"><circle cx="165" cy="210" r="70"/><circle cx="165" cy="210" r="45"/></g><g font-family="Arial, sans-serif" fill="#04112B"><text x="25" y="39" font-size="8" letter-spacing="2">A WORLD OF IDEAS</text><text x="25" y="111" font-size="31" font-weight="700">Your next</text><text x="25" y="148" font-size="31" font-weight="700">chapter</text><text x="25" y="185" font-size="31" font-weight="700">starts here.</text><text x="25" y="298" font-size="11">iLearnOrb</text></g></g>
